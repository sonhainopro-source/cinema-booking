<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vuln Admin Lab - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; color: white; }
        .login-box { background: #333; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(255,0,0,0.2); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; background: #444; border: 1px solid #555; color: white; }
        button { width: 100%; padding: 10px; background: #d32f2f; border: none; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #b71c1c; }
        #message { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="text-align:center;">Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Đăng nhập</button>
        <div id="message"></div>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                document.getElementById('message').innerText = data.error;
            }
        }
    </script>
</body>
</html>
